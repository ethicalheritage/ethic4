<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Προσωρινή σελίδα προορισμού χορηγού</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Roboto, "Segoe UI", "Malgun Gothic", "Yu Gothic", "Noto Sans", sans-serif; font-size: 17px; line-height: 1.6; color: #111; background: #fff; margin: 0 auto; padding: 48px 20px; max-width: 520px; text-align: center; }
  .flag { display: block; width: min(220px, 60vw); height: auto; margin: 0 auto 28px; border: 1px solid rgba(128,128,128,.45); border-radius: 3px; }
  h1 { font-size: 22px; line-height: 1.4; font-weight: 700; margin: 0; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } }
</style>
</head>
<body>
<svg class="flag" viewBox="0 0 27 18" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Σημαία της Ελλάδας"><rect width="27" height="18" fill="#0D5EAF"/><rect y="2" width="27" height="2" fill="#fff"/><rect y="6" width="27" height="2" fill="#fff"/><rect y="10" width="27" height="2" fill="#fff"/><rect y="14" width="27" height="2" fill="#fff"/>
<rect width="10" height="10" fill="#0D5EAF"/><rect x="4" width="2" height="10" fill="#fff"/><rect y="4" width="10" height="2" fill="#fff"/></svg>
<h1>Προσωρινή σελίδα προορισμού χορηγού</h1>
</body>
</html>
