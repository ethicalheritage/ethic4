<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Space available for sponsorships</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  a.banner { display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    width: 100%; height: 100%; padding: clamp(2px, 1vh, 6px) clamp(6px, 3vw, 16px);
    gap: clamp(1px, 1vh, 6px); text-decoration: none; -webkit-tap-highlight-color: rgba(0,0,0,.12); }
  svg.flag { flex: 0 0 auto; height: min(48px, 40vh); width: auto; display: block;
    border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .label { flex: 0 0 auto; max-width: 100%; font-family: -apple-system, Roboto, "Segoe UI", "Malgun Gothic", "Yu Gothic", "Noto Sans", sans-serif;
    font-weight: 600; font-size: clamp(11px, 6vh, 17px); line-height: 1.15; color: #111;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #16181c; }
    .label { color: #f0f0f0; }
    svg.flag { box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
  }
</style>
</head>
<body>
<a class="banner" href="landing.html">
<svg class="flag" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flag of the United Kingdom"><clipPath id="ukA"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
<clipPath id="ukB"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
<g clip-path="url(#ukA)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
<path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
<path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukB)" stroke="#C8102E" stroke-width="4"/>
<path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
<path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
<span class="label">Space available for sponsorships</span>
</a>
</body>
</html>
