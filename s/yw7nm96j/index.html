<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Espaço disponível para patrocínios</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  a.banner { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    width: 100%; height: 100%; padding: clamp(3px, 2vh, 10px) clamp(5px, 2.5vw, 14px);
    gap: clamp(3px, 2vh, 8px); text-decoration: none; -webkit-tap-highlight-color: rgba(0,0,0,.12); }
  svg.flag { flex: 0 0 auto; height: min(60px, 60vh, 15vw); width: auto; display: block;
    border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .label { flex: 0 1 auto; min-width: 0; font-family: -apple-system, Roboto, "Segoe UI", "Malgun Gothic", "Yu Gothic", "Noto Sans", sans-serif;
    font-weight: 600; font-size: clamp(10px, 6vh, 18px); line-height: 1.15; color: #111;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #16181c; }
    .label { color: #f0f0f0; }
    svg.flag { box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
  }
</style>
</head>
<body>
<a class="banner" href="landing.html">
<svg class="flag" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandeira de Portugal"><rect width="240" height="400" fill="#006600"/><rect x="240" width="360" height="400" fill="#FF0000"/>
<circle cx="240" cy="200" r="62" fill="#FFE000"/>
<path d="M212,160 h56 v50 q0,28 -28,40 q-28,-12 -28,-40 z" fill="#fff" stroke="#FF0000" stroke-width="7"/>
<g fill="#003399"><circle cx="240" cy="200" r="6"/><circle cx="240" cy="180" r="6"/><circle cx="240" cy="220" r="6"/><circle cx="222" cy="200" r="6"/><circle cx="258" cy="200" r="6"/></g></svg>
<span class="label">Espaço disponível para patrocínios</span>
</a>
</body>
</html>
