<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Legatum DeadDrop icon" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243253"/>
      <stop offset="1" stop-color="#0E1524"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F6FC"/>
      <stop offset="1" stop-color="#D9E1F0"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B968"/>
      <stop offset="1" stop-color="#B0893B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- envelope -->
  <g filter="url(#soft)">
    <rect x="116" y="150" width="280" height="212" rx="26" ry="26" fill="url(#paper)"/>
    <!-- flap -->
    <path d="M116 176 L256 286 L396 176" fill="none" stroke="#9CA9C4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bottom fold lines (subtle) -->
    <path d="M116 346 L214 268" fill="none" stroke="#C3CEE2" stroke-width="8" stroke-linecap="round"/>
    <path d="M396 346 L298 268" fill="none" stroke="#C3CEE2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- wax seal -->
  <g filter="url(#soft)">
    <circle cx="256" cy="286" r="54" fill="url(#seal)"/>
    <circle cx="256" cy="286" r="54" fill="none" stroke="#8C6B2C" stroke-width="3"/>
    <!-- monogram L -->
    <path d="M243 262 L243 310 L272 310" fill="none" stroke="#3A2B10" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
